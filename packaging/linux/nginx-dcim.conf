# Optional reverse proxy for DCIM. Copy to /etc/nginx/conf.d/dcim.conf and `nginx -t && systemctl reload nginx`.
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8974;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/health {
        proxy_pass http://127.0.0.1:8974/api/health;
        access_log off;
    }
}
