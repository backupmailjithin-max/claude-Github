name: Build DCIM packages

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]
    paths:
      - "dcim/**"
      - "packaging/**"
      - ".github/workflows/build-packages.yml"
  # Lets release-gate.yml (Gate 2 - Package Build, Gate 10 - Offline
  # Appliance) call this same, already-proven build+kit-smoke-test suite as
  # a reusable workflow instead of duplicating it. Purely additive - every
  # existing trigger/behavior above is unchanged.
  workflow_call: {}

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage bundled Node.js runtime
        run: bash packaging/linux/fetch-node-runtime.sh x64 packaging/linux/runtime

      - name: Stage bundled MariaDB runtime (for --embedded-db)
        run: bash packaging/linux/fetch-mariadb-runtime.sh packaging/linux/runtime

      - name: Build .deb
        env:
          DCIM_INTEGRITY_SIGN_KEY: ${{ secrets.DCIM_INTEGRITY_SIGN_KEY }}
          DCIM_REQUIRE_VENDOR: ${{ vars.DCIM_REQUIRE_VENDOR }}
        run: |
          # Vendor-signed manifest: optional repo secret DCIM_INTEGRITY_SIGN_KEY (PEM of the vendor
          # integrity private key). Written outside the checkout, used in memory by package_gate, then
          # deleted. Without it a self-signed manifest is produced (only valid while no vendor key is
          # pinned); set DCIM_REQUIRE_VENDOR=1 to make a release build demand it.
          if [ -n "$DCIM_INTEGRITY_SIGN_KEY" ]; then
            kf="$RUNNER_TEMP/integrity-sign.pem"
            printf '%s' "$DCIM_INTEGRITY_SIGN_KEY" > "$kf"
            export DCIM_INTEGRITY_SIGN_KEY_FILE="$kf"
          fi
          bash packaging/linux/build-deb.sh
          rc=$?
          [ -n "${DCIM_INTEGRITY_SIGN_KEY_FILE:-}" ] && rm -f "$DCIM_INTEGRITY_SIGN_KEY_FILE"
          exit $rc

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: dcim-deb
          path: dist/*.deb

  build-appliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage bundled Node.js runtime
        run: bash packaging/linux/fetch-node-runtime.sh x64 packaging/linux/runtime

      - name: Stage bundled MariaDB runtime (for --embedded-db)
        run: bash packaging/linux/fetch-mariadb-runtime.sh packaging/linux/runtime

      - name: Build offline appliance (.run)
        env:
          DCIM_INTEGRITY_SIGN_KEY: ${{ secrets.DCIM_INTEGRITY_SIGN_KEY }}
          DCIM_REQUIRE_VENDOR: ${{ vars.DCIM_REQUIRE_VENDOR }}
        run: |
          # Vendor-signed manifest: see "Build .deb" step above for the full rationale.
          if [ -n "$DCIM_INTEGRITY_SIGN_KEY" ]; then
            kf="$RUNNER_TEMP/integrity-sign.pem"
            printf '%s' "$DCIM_INTEGRITY_SIGN_KEY" > "$kf"
            export DCIM_INTEGRITY_SIGN_KEY_FILE="$kf"
          fi
          bash packaging/appliance/build-appliance.sh
          rc=$?
          [ -n "${DCIM_INTEGRITY_SIGN_KEY_FILE:-}" ] && rm -f "$DCIM_INTEGRITY_SIGN_KEY_FILE"
          exit $rc

      - name: Upload appliance
        uses: actions/upload-artifact@v4
        with:
          name: dcim-offline-appliance
          path: dist/*.run

  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build tools
        run: dnf install -y rpm-build git tar which nodejs

      - uses: actions/checkout@v4

      - name: Build .rpm
        env:
          DCIM_INTEGRITY_SIGN_KEY: ${{ secrets.DCIM_INTEGRITY_SIGN_KEY }}
          DCIM_REQUIRE_VENDOR: ${{ vars.DCIM_REQUIRE_VENDOR }}
        run: |
          # Vendor-signed manifest: see "Build .deb" step above for the full rationale.
          if [ -n "$DCIM_INTEGRITY_SIGN_KEY" ]; then
            kf="$RUNNER_TEMP/integrity-sign.pem"
            printf '%s' "$DCIM_INTEGRITY_SIGN_KEY" > "$kf"
            export DCIM_INTEGRITY_SIGN_KEY_FILE="$kf"
          fi
          bash packaging/linux/build-rpm.sh
          rc=$?
          [ -n "${DCIM_INTEGRITY_SIGN_KEY_FILE:-}" ] && rm -f "$DCIM_INTEGRITY_SIGN_KEY_FILE"
          exit $rc

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: dcim-rpm
          path: dist/*.rpm

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage bundled Node.js runtime
        shell: pwsh
        run: packaging\windows\fetch-node-runtime.ps1

      - name: Stage NSSM service wrapper
        shell: pwsh
        run: packaging\windows\fetch-nssm.ps1

      - name: Stage bundled MariaDB runtime (for -EmbeddedDb)
        shell: pwsh
        run: packaging\windows\fetch-mariadb-runtime.ps1

      # All three share the same payload (webapp/runtime/nssm staged above) and
      # the same AppId, differing only in which install.js -Mode they force -
      # not three separate install engines, just three entry points into the
      # one already-tested install.js. Compiled as separate steps (not one
      # combined step) so a failure in any single one fails the job loudly
      # with its own isolated log, instead of silently falling through to
      # "success" while missing its output file.
      - name: Bytenode-compile license.js/integrity.js (bundled runtime guarantees the exact Node build)
        shell: pwsh
        env:
          DCIM_BYTENODE: ${{ vars.DCIM_BYTENODE }}
        run: |
          # Defaults ON here (unless the repo variable DCIM_BYTENODE is explicitly '0'): the Windows job always
          # stages its own exact bundled Node runtime above, so bytecode compiled against it is guaranteed to match.
          if ($env:DCIM_BYTENODE -ne '0') {
            node packaging\tools\bytenode-compile.js --webapp dcim\webapp --node packaging\windows\runtime\node\node.exe
            if ($LASTEXITCODE -ne 0) { throw "bytenode compile failed" }
          } else {
            Write-Host "DCIM_BYTENODE=0 - skipping (license.js/integrity.js ship as plain JS)."
          }

      - name: Integrity manifest + package validation (fails on licence tools, signing material or private keys)
        shell: pwsh
        env:
          DCIM_INTEGRITY_SIGN_KEY: ${{ secrets.DCIM_INTEGRITY_SIGN_KEY }}
          DCIM_REQUIRE_VENDOR: ${{ vars.DCIM_REQUIRE_VENDOR }}
        run: |
          # Vendor-signed manifest: optional repo secret DCIM_INTEGRITY_SIGN_KEY (PEM of the vendor integrity private key).
          # It is written outside the checkout, used in memory by the signer, and deleted. Without it a self-signed manifest
          # is produced (only valid while no vendor key is pinned); set DCIM_REQUIRE_VENDOR=1 to make a release build demand it.
          $req = @()
          if ($env:DCIM_INTEGRITY_SIGN_KEY) {
            $kf = Join-Path $env:RUNNER_TEMP 'integrity-sign.pem'
            Set-Content -Path $kf -Value $env:DCIM_INTEGRITY_SIGN_KEY -NoNewline
            $env:DCIM_INTEGRITY_SIGN_KEY_FILE = $kf
          }
          if ($env:DCIM_REQUIRE_VENDOR -eq '1') { $req = @('--require-vendor') }
          node packaging\tools\make-integrity-manifest.js --webapp dcim\webapp
          $rc = $LASTEXITCODE
          if ($env:DCIM_INTEGRITY_SIGN_KEY_FILE) { Remove-Item -Force $env:DCIM_INTEGRITY_SIGN_KEY_FILE -ErrorAction SilentlyContinue }
          if ($rc -ne 0) { throw "integrity manifest creation failed" }
          node packaging\tools\validate-package.js --root dcim\webapp --require-manifest @req `
            --iss packaging\windows\dcim-installer.iss --iss packaging\windows\dcim-upgrade-utility.iss --iss packaging\windows\dcim-repair-utility.iss
          if ($LASTEXITCODE -ne 0) { throw "package validation failed - installers NOT built" }

      - name: Compile main installer (dcim-installer.iss) with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup (ISCC.exe) not found on this runner image." }
          & $iscc packaging\windows\dcim-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed compiling dcim-installer.iss (exit $LASTEXITCODE)" }

      - name: Compile upgrade utility (dcim-upgrade-utility.iss) with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc packaging\windows\dcim-upgrade-utility.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed compiling dcim-upgrade-utility.iss (exit $LASTEXITCODE)" }

      - name: Compile repair utility (dcim-repair-utility.iss) with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc packaging\windows\dcim-repair-utility.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed compiling dcim-repair-utility.iss (exit $LASTEXITCODE)" }

      - name: Verify all three installers were produced
        shell: pwsh
        run: |
          $expected = @(
            "packaging\windows\Output\dcim-setup-3.2.2.exe",
            "packaging\windows\Output\DCIM-Upgrade-3.2.2.exe",
            "packaging\windows\Output\DCIM-Repair-3.2.2.exe"
          )
          $missing = $expected | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing expected installer output(s): $($missing -join ', ')" }
          Get-ChildItem packaging\windows\Output\*.exe | Format-Table Name, Length

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: dcim-windows-installer
          path: packaging/windows/Output/*.exe

  # Assembles the single-download Distribution Kit from the four artifacts
  # above. This job only arranges already-built, already-tested files - see
  # packaging/kit/build-kit.sh. If any one upstream build fails, the kit still
  # gets built with whatever did succeed (build-kit.sh warns, doesn't fail) so
  # a partial run still produces something inspectable.
  build-kit:
    needs: [build-deb, build-rpm, build-appliance, build-windows-exe]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download .deb
        uses: actions/download-artifact@v4
        with: { name: dcim-deb, path: dist }
        continue-on-error: true

      - name: Download .rpm
        uses: actions/download-artifact@v4
        with: { name: dcim-rpm, path: dist }
        continue-on-error: true

      - name: Download appliance
        uses: actions/download-artifact@v4
        with: { name: dcim-offline-appliance, path: dist }
        continue-on-error: true

      - name: Download Windows installer + utilities
        uses: actions/download-artifact@v4
        with: { name: dcim-windows-installer, path: packaging/windows/Output }
        continue-on-error: true

      - name: Assemble kit
        run: bash packaging/kit/build-kit.sh

      - name: Upload kit
        uses: actions/upload-artifact@v4
        with:
          name: dcim-enterprise-offline-kit
          path: |
            dist/DCIM-Enterprise-Offline-Kit-*.tar.gz
            dist/DCIM-Enterprise-Offline-Kit-*.zip

      # Real execution of the OS-detecting dispatcher itself (packaging/kit/install)
      # - not the .deb/.rpm/.run mechanics it hands off to, which are already
      # covered by test-lifecycle.yml. This is the one piece of the kit that has
      # no other test coverage: does it correctly identify this as a
      # Debian/Ubuntu host and invoke the bundled .deb via dpkg.
      - name: Smoke-test the kit's OS-detecting dispatcher on Ubuntu
        if: always()
        run: |
          set -e
          sudo systemctl stop mysql.service 2>/dev/null || true
          sudo apt-get update -y
          sudo apt-get install -y mariadb-server
          sudo systemctl start mariadb
          sudo mysql -u root -e "CREATE DATABASE dcim_kit_test CHARACTER SET utf8mb4; CREATE USER 'dcim'@'localhost' IDENTIFIED BY 'KitTestPass123!'; GRANT ALL ON dcim_kit_test.* TO 'dcim'@'localhost'; FLUSH PRIVILEGES;"
          mkdir -p /tmp/kit-extract
          tar -xzf dist/DCIM-Enterprise-Offline-Kit-*.tar.gz -C /tmp/kit-extract
          KIT_DIR=$(find /tmp/kit-extract -maxdepth 1 -type d -name "DCIM-Enterprise-Offline-Kit-*")
          echo "Using kit at: $KIT_DIR"
          cd "$KIT_DIR"
          sudo ./install
          sudo dcim-setup --mode install --yes --port 18977 \
            --db-user dcim --db-password 'KitTestPass123!' --db-name dcim_kit_test
          sleep 3
          curl -fsS http://127.0.0.1:18977/api/health | grep -q '"status":"ok"'
          echo "Kit dispatcher correctly detected this host and installed via the native .deb."
