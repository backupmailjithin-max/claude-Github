name: unit-tests
on:
  push:
    branches: ['**']
    paths: ['dcim/webapp/**']
  pull_request:
    paths: ['dcim/webapp/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        working-directory: dcim/webapp
        run: npm ci --omit=dev || npm install --omit=dev
      - name: Unit tests
        working-directory: dcim/webapp
        run: npm test
