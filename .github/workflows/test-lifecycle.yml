name: Test DCIM install/upgrade/repair/rollback (real execution)

# Actually RUNS the installers end-to-end against a real database and a real
# service manager, on real GitHub-hosted VMs/containers - not just a compile
# check. Separate from build-packages.yml (which only builds artifacts) since
# this exercises behavior, takes longer, and is meant to be triggered
# deliberately (pre-UAT, pre-release) rather than on every push.
on:
  workflow_dispatch: {}
  # Lets release-gate.yml (Gate 3 - Installation Validation, Gate 5/7 repair/
  # rollback) call this same, already-proven suite as a reusable workflow
  # instead of duplicating its ~400 lines of real install/upgrade/repair/
  # rollback logic. Purely additive - every existing trigger/behavior above
  # is unchanged.
  workflow_call: {}

jobs:
  # Real GitHub-hosted Windows Server VMs (real Service Control Manager, not a
  # container) - this path was previously never executed at all, only
  # code-reviewed. windows-2022 maps to Windows Server 2022.
  #
  # windows-2019 REMOVED FROM THE MATRIX - CONFIRMED UNAVAILABLE, not a DCIM
  # defect. Three separate real runs (38790702714, 38792178744, 38793404209)
  # never got a runner assigned at all: the job sat in "queued" with no
  # "Set up job" step and no error, while every other job in the same run
  # completed normally within a minute or two. `timeout-minutes` does NOT
  # help here - it only bounds a RUNNING job, not time spent waiting in the
  # queue for a runner that will never be assigned, so it left the job
  # queued indefinitely anyway (confirmed: run 38793404209 was still queued
  # after its 5-minute timeout should have fired). This is the real-world
  # signature of a hosted runner image GitHub has stopped offering. Genuine
  # Windows Server 2019 execution evidence would require a self-hosted
  # Server 2019 runner - it cannot be obtained from GitHub-hosted runners,
  # and leaving it in the matrix only stalls every future CI run for no
  # benefit.
  test-windows-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage bundled Node.js runtime
        shell: pwsh
        run: packaging\windows\fetch-node-runtime.ps1

      - name: Stage NSSM service wrapper
        shell: pwsh
        run: packaging\windows\fetch-nssm.ps1

      - name: Install MySQL
        shell: pwsh
        run: |
          choco install mysql --no-progress -y
          Start-Service MySQL

      - name: Create test database and user
        shell: pwsh
        run: |
          $mysql = "C:\tools\mysql\current\bin\mysql.exe"
          if (-not (Test-Path $mysql)) { $mysql = (Get-Command mysql.exe).Source }
          & $mysql -u root -e "CREATE DATABASE dcim_test CHARACTER SET utf8mb4; CREATE USER 'dcim'@'localhost' IDENTIFIED BY 'TestPass123!'; GRANT ALL ON dcim_test.* TO 'dcim'@'localhost'; FLUSH PRIVILEGES;"

      - name: Install (fresh)
        shell: pwsh
        run: |
          node packaging\windows\install.js -Mode install -Yes -InstallDir C:\DCIM -Port 18974 `
            -DbUser dcim -DbPassword 'TestPass123!' -DbName dcim_test `
            -AdminUser ciadmin -AdminPassword 'CiAdminPass123!'

      - name: Diagnostics (always, even on failure)
        if: always()
        shell: pwsh
        run: |
          Write-Host "--- Get-Service DCIM ---"
          Get-Service -Name DCIM -ErrorAction SilentlyContinue | Format-List *
          Write-Host "--- NSSM status ---"
          if (Test-Path C:\DCIM\tools\nssm.exe) { & C:\DCIM\tools\nssm.exe status DCIM }
          Write-Host "--- stdout log ---"
          Get-Content C:\DCIM\webapp\logs\service-stdout.log -ErrorAction SilentlyContinue -Tail 100
          Write-Host "--- stderr log ---"
          Get-Content C:\DCIM\webapp\logs\service-stderr.log -ErrorAction SilentlyContinue -Tail 100
          Write-Host "--- app log files ---"
          Get-ChildItem C:\DCIM\webapp\logs -ErrorAction SilentlyContinue
          Write-Host "--- .env (redacted) ---"
          if (Test-Path C:\DCIM\webapp\.env) { (Get-Content C:\DCIM\webapp\.env) -replace '(PASSWORD|SECRET)=.*','$1=[redacted]' }

      - name: Verify service is really running (NSSM)
        shell: pwsh
        run: |
          $svc = Get-Service -Name DCIM
          if ($svc.Status -ne 'Running') { throw "DCIM service is not Running (status: $($svc.Status))" }
          $h = Invoke-RestMethod -Uri "http://127.0.0.1:18974/api/health"
          if ($h.status -ne 'ok') { throw "Health check did not report ok" }
          Write-Host "Service running, health OK."

      - name: Populate test data (proves admin account + API work for real)
        shell: pwsh
        run: |
          $login = Invoke-RestMethod -Uri "http://127.0.0.1:18974/api/auth/login" -Method Post -ContentType "application/json" -Body (@{username="ciadmin";password="CiAdminPass123!"} | ConvertTo-Json)
          $headers = @{ Authorization = "Bearer $($login.token)" }
          Invoke-RestMethod -Uri "http://127.0.0.1:18974/api/locations" -Method Post -ContentType "application/json" -Headers $headers -Body (@{name="CiTestDC";zoneName="AZ-1"} | ConvertTo-Json) | Out-Null

      - name: Upgrade
        shell: pwsh
        run: node packaging\windows\install.js -Mode upgrade -Yes -InstallDir C:\DCIM -Port 18974 -DbUser dcim -DbPassword 'TestPass123!' -DbName dcim_test

      - name: Verify data survived Upgrade + service still healthy
        shell: pwsh
        run: |
          Start-Sleep -Seconds 3
          $h = Invoke-RestMethod -Uri "http://127.0.0.1:18974/api/health"
          if ($h.status -ne 'ok') { throw "Health check failed after upgrade" }
          $login = Invoke-RestMethod -Uri "http://127.0.0.1:18974/api/auth/login" -Method Post -ContentType "application/json" -Body (@{username="ciadmin";password="CiAdminPass123!"} | ConvertTo-Json)
          $locs = Invoke-RestMethod -Uri "http://127.0.0.1:18974/api/locations" -Headers @{ Authorization = "Bearer $($login.token)" }
          if (-not ($locs.name -contains "CiTestDC")) { throw "Test location did not survive Upgrade" }
          Write-Host "Data survived Upgrade."

      - name: Repair
        shell: pwsh
        run: node packaging\windows\install.js -Mode repair -Yes -InstallDir C:\DCIM -Port 18974 -DbUser dcim -DbPassword 'TestPass123!' -DbName dcim_test

      - name: Verify data survived Repair + service still healthy
        shell: pwsh
        run: |
          Start-Sleep -Seconds 3
          $h = Invoke-RestMethod -Uri "http://127.0.0.1:18974/api/health"
          if ($h.status -ne 'ok') { throw "Health check failed after repair" }
          Write-Host "Service healthy after Repair."

      - name: Delete test data, then roll back, then verify it's restored
        shell: pwsh
        run: |
          $mysql = "C:\tools\mysql\current\bin\mysql.exe"
          if (-not (Test-Path $mysql)) { $mysql = (Get-Command mysql.exe).Source }
          & $mysql -u root dcim_test -e "DELETE FROM locations WHERE name='CiTestDC';"
          $snapshotMarker = Get-Content "C:\DCIM\.last-pre-change-backup" -Raw
          Write-Host "Rolling back to: $snapshotMarker"
          Write-Host "--- mysqldump.err (if any, from every snapshot taken this run) ---"
          Get-ChildItem C:\ProgramData\dcim-backups -Recurse -Filter "mysqldump.err" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=== $($_.FullName) ==="; Get-Content $_.FullName
          }
          node packaging\windows\rollback.js -InstallDir C:\DCIM -Yes
          Start-Sleep -Seconds 3
          $login = Invoke-RestMethod -Uri "http://127.0.0.1:18974/api/auth/login" -Method Post -ContentType "application/json" -Body (@{username="ciadmin";password="CiAdminPass123!"} | ConvertTo-Json)
          $locs = Invoke-RestMethod -Uri "http://127.0.0.1:18974/api/locations" -Headers @{ Authorization = "Bearer $($login.token)" }
          if (-not ($locs.name -contains "CiTestDC")) { throw "Rollback did not restore the test location" }
          Write-Host "Rollback restored the deleted data. Full lifecycle verified on Windows."

  # ubuntu-latest is a real VM with systemd as PID 1 (unlike the sandbox this
  # was developed in, which has no systemd at all) - this is the first fully
  # real systemd service-lifecycle test for the Linux path.
  test-ubuntu-systemd-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MariaDB
        run: |
          # ubuntu-latest ships MySQL 8 pre-installed; stop it first so it can't
          # fight MariaDB for port 3306 (discovered via a failed run of this job).
          sudo systemctl stop mysql.service 2>/dev/null || true
          sudo apt-get update -y
          sudo apt-get install -y mariadb-server
          sudo systemctl start mariadb
          sudo mysql -u root -e "CREATE DATABASE dcim_test CHARACTER SET utf8mb4; CREATE USER 'dcim'@'localhost' IDENTIFIED BY 'TestPass123!'; GRANT ALL ON dcim_test.* TO 'dcim'@'localhost'; FLUSH PRIVILEGES;"

      - name: Install (fresh)
        run: |
          sudo bash packaging/linux/install.sh --mode install --yes --port 18974 \
            --db-user dcim --db-password 'TestPass123!' --db-name dcim_test \
            --admin-user ciadmin --admin-password 'CiAdminPass123!' \
            --csp-mode enforce --audit-retention-days 90

      - name: Diagnostics (always, even on failure)
        if: always()
        run: |
          echo "--- systemctl status dcim ---"
          sudo systemctl status dcim --no-pager || true
          echo "--- journalctl -u dcim ---"
          sudo journalctl -u dcim --no-pager -n 200 || true
          echo "--- ss -ltnp ---"
          sudo ss -ltnp || true
          echo "--- .env (redacted) ---"
          sudo sed -E 's/(PASSWORD|SECRET)=.*/\1=[redacted]/' /opt/dcim/webapp/.env || true
          echo "--- mysql connectivity as dcim ---"
          mysql -h localhost -u dcim -p'TestPass123!' -e "SELECT 1;" dcim_test || true

      - name: Verify systemd service is really running
        run: |
          sudo systemctl is-active dcim
          sudo systemctl is-enabled dcim
          curl -fsS http://127.0.0.1:18974/api/health | grep -q '"status":"ok"'
          sudo journalctl -u dcim --no-pager -n 20

      - name: Verify dedicated upgrade/repair utilities are installed and work
        run: |
          command -v dcim-service
          command -v dcim-upgrade
          command -v dcim-repair

      - name: Populate test data
        run: |
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:18974/api/auth/login -H 'Content-Type: application/json' -d '{"username":"ciadmin","password":"CiAdminPass123!"}' | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).token))")
          curl -fsS -X POST http://127.0.0.1:18974/api/locations -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"name":"CiTestDC","zoneName":"AZ-1"}'

      - name: Upgrade via the dedicated utility (dcim-upgrade)
        run: sudo dcim-upgrade --port 18974 --db-user dcim --db-password 'TestPass123!' --db-name dcim_test

      - name: Verify data survived Upgrade
        run: |
          sleep 3
          curl -fsS http://127.0.0.1:18974/api/health | grep -q '"status":"ok"'
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:18974/api/auth/login -H 'Content-Type: application/json' -d '{"username":"ciadmin","password":"CiAdminPass123!"}' | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).token))")
          curl -fsS http://127.0.0.1:18974/api/locations -H "Authorization: Bearer $TOKEN" | grep -q CiTestDC

      - name: Repair via the dedicated utility (dcim-repair)
        run: sudo dcim-repair --port 18974 --db-user dcim --db-password 'TestPass123!' --db-name dcim_test

      - name: Verify service healthy after Repair
        run: |
          sleep 3
          sudo systemctl is-active dcim
          curl -fsS http://127.0.0.1:18974/api/health | grep -q '"status":"ok"'

      - name: Delete test data, roll back, verify restored
        run: |
          sudo mysql -u root dcim_test -e "DELETE FROM locations WHERE name='CiTestDC';"
          SNAPSHOT=$(sudo cat /opt/dcim/.last-pre-change-backup)
          echo "Rolling back to: $SNAPSHOT"
          echo y | sudo bash packaging/linux/rollback.sh "$SNAPSHOT"
          sleep 3
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:18974/api/auth/login -H 'Content-Type: application/json' -d '{"username":"ciadmin","password":"CiAdminPass123!"}' | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).token))")
          curl -fsS http://127.0.0.1:18974/api/locations -H "Authorization: Bearer $TOKEN" | grep -q CiTestDC
          echo "Rollback restored the deleted data. Full lifecycle verified on Ubuntu with real systemd."

  # RockyLinux/AlmaLinux containers can't run systemd as PID 1 under GitHub
  # Actions (same limitation this whole project was developed under locally),
  # so this verifies the .rpm installs cleanly and lays down the right files/
  # utilities - not full service-lifecycle, which test-ubuntu-systemd-lifecycle
  # above covers for the systemd logic shared across every Linux target.
  test-rpm-distro-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["rockylinux:9", "almalinux:9"]
    container: ${{ matrix.image }}
    steps:
      - name: Install build tools
        run: dnf install -y rpm-build git tar which

      - uses: actions/checkout@v4

      - name: Build .rpm
        run: bash packaging/linux/build-rpm.sh

      - name: Install the .rpm
        run: dnf install -y ./dist/dcim-*.rpm

      - name: Verify package layout and utilities
        run: |
          test -x /usr/share/dcim/install.sh
          test -x /usr/share/dcim/uninstall.sh
          test -x /usr/share/dcim/rollback.sh
          test -x /usr/bin/dcim-setup
          test -x /usr/bin/dcim-service
          test -x /usr/bin/dcim-upgrade
          test -x /usr/bin/dcim-repair
          test -d /usr/share/dcim/webapp/node_modules
          test -f /usr/share/dcim/webapp/schema.sql
          echo "Package layout verified on ${{ matrix.image }}."

  # Real execution of the --embedded-db option (Database Strategy "Option 1"):
  # no external MySQL/MariaDB at all - install.sh brings up its own private
  # MariaDB instance (dcim-mariadb.service) and the app connects to that.
  test-embedded-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage bundled MariaDB runtime
        run: bash packaging/linux/fetch-mariadb-runtime.sh packaging/linux/runtime

      - name: Reject --db-user root for the embedded database (real collision found via execution)
        run: |
          # "root" collides with the embedded engine's own admin account:
          # a TCP connection to 127.0.0.1 gets authenticated by MariaDB
          # against 'root'@'localhost' (this script's own maintenance
          # account, re-passworded separately) instead of 'root'@'127.0.0.1',
          # so the app ends up using the wrong password no matter how the
          # SQL is written - confirmed by a real install that chose "root"
          # and got Access Denied. install.sh now rejects it outright;
          # verify that rejection stays in place rather than regressing
          # back to a silent Access Denied failure later.
          if sudo bash packaging/linux/install.sh --mode install --yes --embedded-db --port 18975 \
            --db-user root --admin-user ciadmin --admin-password 'CiAdminPass123!'; then
            echo "::error::install.sh accepted --db-user root for the embedded DB - this should have been rejected."
            exit 1
          fi
          echo "Correctly rejected --db-user root."

      - name: Install (fresh, --embedded-db, no external MySQL/MariaDB present)
        run: |
          sudo bash packaging/linux/install.sh --mode install --yes --embedded-db --port 18975 \
            --admin-user ciadmin --admin-password 'CiAdminPass123!'

      - name: Diagnostics (always, even on failure)
        if: always()
        run: |
          echo "--- systemctl status dcim-mariadb ---"
          sudo systemctl status dcim-mariadb --no-pager || true
          echo "--- journalctl -u dcim-mariadb ---"
          sudo journalctl -u dcim-mariadb --no-pager -n 100 || true
          echo "--- systemctl status dcim ---"
          sudo systemctl status dcim --no-pager || true
          echo "--- journalctl -u dcim ---"
          sudo journalctl -u dcim --no-pager -n 100 || true
          echo "--- .env (redacted) ---"
          sudo sed -E 's/(PASSWORD|SECRET)=.*/\1=[redacted]/' /opt/dcim/webapp/.env || true

      - name: Verify both services are really running
        run: |
          sudo systemctl is-active dcim-mariadb
          sudo systemctl is-enabled dcim-mariadb
          sudo systemctl is-active dcim
          sudo systemctl is-enabled dcim
          curl -fsS http://127.0.0.1:18975/api/health | grep -q '"status":"ok"'

      - name: Populate test data
        run: |
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:18975/api/auth/login -H 'Content-Type: application/json' -d '{"username":"ciadmin","password":"CiAdminPass123!"}' | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).token))")
          curl -fsS -X POST http://127.0.0.1:18975/api/locations -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"name":"CiEmbeddedDC","zoneName":"AZ-1"}'

      - name: Upgrade (embedded DB must survive and stay usable)
        run: sudo dcim-upgrade --port 18975

      - name: Verify data survived Upgrade
        run: |
          sleep 3
          curl -fsS http://127.0.0.1:18975/api/health | grep -q '"status":"ok"'
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:18975/api/auth/login -H 'Content-Type: application/json' -d '{"username":"ciadmin","password":"CiAdminPass123!"}' | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).token))")
          curl -fsS http://127.0.0.1:18975/api/locations -H "Authorization: Bearer $TOKEN" | grep -q CiEmbeddedDC

      - name: Repair (must re-detect embedded mode without --embedded-db being re-passed)
        run: sudo dcim-repair --port 18975

      - name: Verify embedded DB and data survived Repair
        run: |
          sleep 3
          sudo systemctl is-active dcim-mariadb
          sudo systemctl is-active dcim
          curl -fsS http://127.0.0.1:18975/api/health | grep -q '"status":"ok"'
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:18975/api/auth/login -H 'Content-Type: application/json' -d '{"username":"ciadmin","password":"CiAdminPass123!"}' | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).token))")
          curl -fsS http://127.0.0.1:18975/api/locations -H "Authorization: Bearer $TOKEN" | grep -q CiEmbeddedDC
          echo "Embedded MariaDB verified across install, upgrade, and repair."

  # Windows equivalent of test-embedded-db above: -EmbeddedDb, no external
  # MySQL/MariaDB install step needed at all (that's the point).
  test-windows-embedded-db:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Stage bundled Node.js runtime
        shell: pwsh
        run: packaging\windows\fetch-node-runtime.ps1

      - name: Stage NSSM service wrapper
        shell: pwsh
        run: packaging\windows\fetch-nssm.ps1

      - name: Stage bundled MariaDB runtime
        shell: pwsh
        run: packaging\windows\fetch-mariadb-runtime.ps1

      - name: Reject -DbUser root for the embedded database (real collision found via execution)
        shell: pwsh
        # "root" collides with the embedded engine's own admin account: a
        # TCP connection to 127.0.0.1 gets authenticated by MariaDB against
        # 'root'@'localhost' (this script's own maintenance account,
        # re-passworded separately) instead of 'root'@'127.0.0.1', so the
        # app ends up using the wrong password no matter how the SQL is
        # written - confirmed by a real install that chose "root" and got
        # Access Denied. install.js now rejects it outright; verify that
        # rejection stays in place rather than regressing back to a silent
        # Access Denied failure later.
        run: |
          node packaging\windows\install.js -Mode install -Yes -EmbeddedDb -InstallDir C:\DCIM -Port 18976 -DbUser root -AdminUser ciadmin -AdminPassword 'CiAdminPass123!'
          if ($LASTEXITCODE -eq 0) { throw "install.js accepted -DbUser root for the embedded DB - this should have been rejected." }
          Write-Host "Correctly rejected -DbUser root."

      - name: Install (fresh, -EmbeddedDb, no external MySQL/MariaDB present)
        shell: pwsh
        run: node packaging\windows\install.js -Mode install -Yes -EmbeddedDb -InstallDir C:\DCIM -Port 18976 -AdminUser ciadmin -AdminPassword 'CiAdminPass123!'

      - name: Diagnostics (always, even on failure)
        if: always()
        shell: pwsh
        run: |
          Write-Host "--- Get-Service DCIMMariaDB ---"
          Get-Service DCIMMariaDB -ErrorAction SilentlyContinue | Format-List *
          Write-Host "--- Get-Service DCIM ---"
          Get-Service DCIM -ErrorAction SilentlyContinue | Format-List *
          Write-Host "--- .env (redacted) ---"
          if (Test-Path C:\DCIM\webapp\.env) { (Get-Content C:\DCIM\webapp\.env) -replace '(PASSWORD|SECRET)=.*', '$1=[redacted]' }

      - name: Verify both services are really running
        shell: pwsh
        run: |
          if ((Get-Service DCIMMariaDB).Status -ne "Running") { throw "DCIMMariaDB is not running" }
          if ((Get-Service DCIM).Status -ne "Running") { throw "DCIM is not running" }
          $h = Invoke-RestMethod -Uri "http://127.0.0.1:18976/api/health"
          if ($h.status -ne "ok") { throw "Health check failed" }

      - name: Populate test data
        shell: pwsh
        run: |
          $login = Invoke-RestMethod -Uri "http://127.0.0.1:18976/api/auth/login" -Method Post -ContentType "application/json" -Body (@{username="ciadmin";password="CiAdminPass123!"} | ConvertTo-Json)
          Invoke-RestMethod -Uri "http://127.0.0.1:18976/api/locations" -Method Post -ContentType "application/json" -Headers @{ Authorization = "Bearer $($login.token)" } -Body (@{name="CiEmbeddedDC";zoneName="AZ-1"} | ConvertTo-Json) | Out-Null

      - name: Upgrade (embedded DB must survive and stay usable)
        shell: pwsh
        run: node packaging\windows\install.js -Mode upgrade -Yes -InstallDir C:\DCIM -Port 18976

      - name: Verify data survived Upgrade
        shell: pwsh
        run: |
          Start-Sleep -Seconds 3
          $h = Invoke-RestMethod -Uri "http://127.0.0.1:18976/api/health"
          if ($h.status -ne "ok") { throw "Health check failed after upgrade" }
          $login = Invoke-RestMethod -Uri "http://127.0.0.1:18976/api/auth/login" -Method Post -ContentType "application/json" -Body (@{username="ciadmin";password="CiAdminPass123!"} | ConvertTo-Json)
          $locs = Invoke-RestMethod -Uri "http://127.0.0.1:18976/api/locations" -Headers @{ Authorization = "Bearer $($login.token)" }
          if (-not ($locs.name -contains "CiEmbeddedDC")) { throw "Test location did not survive Upgrade" }

      - name: Repair (must re-detect embedded mode without -EmbeddedDb being re-passed)
        shell: pwsh
        run: node packaging\windows\install.js -Mode repair -Yes -InstallDir C:\DCIM -Port 18976

      - name: Verify embedded DB and data survived Repair
        shell: pwsh
        run: |
          Start-Sleep -Seconds 3
          if ((Get-Service DCIMMariaDB).Status -ne "Running") { throw "DCIMMariaDB is not running after repair" }
          if ((Get-Service DCIM).Status -ne "Running") { throw "DCIM is not running after repair" }
          $login = Invoke-RestMethod -Uri "http://127.0.0.1:18976/api/auth/login" -Method Post -ContentType "application/json" -Body (@{username="ciadmin";password="CiAdminPass123!"} | ConvertTo-Json)
          $locs = Invoke-RestMethod -Uri "http://127.0.0.1:18976/api/locations" -Headers @{ Authorization = "Bearer $($login.token)" }
          if (-not ($locs.name -contains "CiEmbeddedDC")) { throw "Test location did not survive Repair" }
          Write-Host "Embedded MariaDB verified across install, upgrade, and repair on Windows."

  # Every job above calls install.js directly - which never exercises the
  # compiled .exe's own Pascal Script ([Code] section) at all: the wizard's
  # page logic, ShouldSkipPage/NextButtonClick validation, GetInstallParams'
  # string-building, and the CurStepChanged/Exec() launch of install.js
  # itself. That gap is exactly how the "runas" flag typo made it past CI
  # once already - ISCC caught it, but only because it happened to be a
  # compile-time error; a Pascal Script RUNTIME bug (wrong page ID, a typo
  # in a .Values[] index, GetInstallParams building a malformed string) would
  # not be. This job actually runs the real, compiled dcim-setup-*.exe in
  # silent mode - not interactive (no GitHub-hosted Windows runner can show a
  # GUI to click through; see docs/guides for why only a real human on a real
  # desktop can do that), but /VERYSILENT still executes every line of the
  # installer's own [Code] exactly as an interactive run would, just using
  # the wizard pages' default values instead of someone typing into them.
  test-windows-compiled-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Stage bundled Node.js runtime
        shell: pwsh
        run: packaging\windows\fetch-node-runtime.ps1

      - name: Stage NSSM service wrapper
        shell: pwsh
        run: packaging\windows\fetch-nssm.ps1

      - name: Stage bundled MariaDB runtime
        shell: pwsh
        run: packaging\windows\fetch-mariadb-runtime.ps1

      - name: Compile the real installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup (ISCC.exe) not found on this runner image." }
          & $iscc packaging\windows\dcim-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed compiling dcim-installer.iss (exit $LASTEXITCODE)" }

      - name: Run the compiled installer silently (default wizard values - bundled DB, port 8974)
        shell: pwsh
        run: |
          $exe = Get-ChildItem "packaging\windows\Output\dcim-setup-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No dcim-setup-*.exe found in packaging\windows\Output" }
          Start-Process -FilePath $exe.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=D:\inno-install-log.txt" -Wait

      - name: Inno Setup's own log (always, even on success - this is the real [Code] execution trace)
        if: always()
        shell: pwsh
        run: if (Test-Path D:\inno-install-log.txt) { Get-Content D:\inno-install-log.txt }

      - name: Diagnostics (always, even on failure)
        if: always()
        shell: pwsh
        run: |
          Write-Host "--- Get-Service DCIMMariaDB ---"
          Get-Service DCIMMariaDB -ErrorAction SilentlyContinue | Format-List *
          Write-Host "--- Get-Service DCIM ---"
          Get-Service DCIM -ErrorAction SilentlyContinue | Format-List *
          Write-Host "--- C:\DCIM\webapp\.env (redacted) ---"
          if (Test-Path C:\DCIM\webapp\.env) { (Get-Content C:\DCIM\webapp\.env) -replace '(PASSWORD|SECRET)=.*', '$1=[redacted]' } else { Write-Host "MISSING" }
          Write-Host "--- C:\DCIM\INSTALL-SUMMARY.txt ---"
          if (Test-Path C:\DCIM\INSTALL-SUMMARY.txt) { Get-Content C:\DCIM\INSTALL-SUMMARY.txt } else { Write-Host "MISSING" }
          Write-Host "--- C:\DCIM\install.log (install.js's own transcript - Exec() from [Code] doesn't capture console output, so this is the only place its real error ever shows up) ---"
          if (Test-Path C:\DCIM\install.log) { Get-Content C:\DCIM\install.log } else { Write-Host "MISSING" }

      - name: Verify the installer actually configured everything (not just a successful-looking exit code)
        shell: pwsh
        run: |
          if (-not (Test-Path C:\DCIM\webapp\.env)) { throw ".env was not created - the compiled installer did not really configure the app." }
          if (-not (Test-Path C:\DCIM\INSTALL-SUMMARY.txt)) { throw "INSTALL-SUMMARY.txt was not created." }
          if ((Get-Service DCIMMariaDB).Status -ne "Running") { throw "DCIMMariaDB is not running after a silent run of the real installer." }
          if ((Get-Service DCIM).Status -ne "Running") { throw "DCIM is not running after a silent run of the real installer." }
          $h = Invoke-RestMethod -Uri "http://127.0.0.1:8974/api/health"
          if ($h.status -ne "ok") { throw "Health check failed after a silent run of the real installer." }
          Write-Host "The compiled installer, run exactly as a customer's double-click would (just non-interactively), produced a fully working install."
