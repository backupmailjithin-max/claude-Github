name: Publish installers as a release

# Takes the installers already built by a "Build DCIM packages" run and attaches
# them to a GitHub release so they can be downloaded from a normal web page.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of a successful 'Build DCIM packages' run"
        required: true
      tag:
        description: "Release tag to create, e.g. v3.2.2-rc1"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download installers from the build run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl
          pattern: dcim-*
          merge-multiple: false
      - name: List files
        run: find dl -type f -printf '%s %p\n' | sort -k2
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir out
          cp dl/dcim-windows-installer/*.exe out/
          cp dl/dcim-deb/*.deb out/
          cp dl/dcim-rpm/*.rpm out/
          cp dl/dcim-offline-appliance/*.run out/
          cp docs/guides/DCIM-Dashboard-User-Guide.pdf out/
          (cd out && sha256sum * > SHA256SUMS.txt)
          gh release create "${{ inputs.tag }}" out/* --prerelease --target "${{ github.sha }}" \
            --title "DCIM ${{ inputs.tag }} (test build)" \
            --notes "Windows installer, Linux .deb / .rpm / offline appliance, and the User Guide. Test build from commit ${{ github.sha }}."
