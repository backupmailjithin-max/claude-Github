name: Release - Commercial (licensed)

# Pipeline for the COMMERCIAL customer edition (source: dcim/webapp, licensing ON).
# Builds every customer package in release mode, then verifies the result before anything is published:
#   preflight -> build (build-packages.yml, DCIM_RELEASE_BUILD=1, vendor signing key) -> verify -> (tag only) draft release
# It never touches the internal edition. Needs repository secret DCIM_INTEGRITY_SIGN_KEY (vendor integrity private key, PEM).
# Note: GitHub lists "Run workflow" only for workflow files that exist on the default branch.

on:
  workflow_dispatch:
    inputs:
      require_signed:
        description: "Fail unless the vendor signing key secret is present (leave on for any customer delivery)"
        type: boolean
        default: true
  push:
    tags: ["commercial-v*"]

permissions:
  contents: read

concurrency:
  group: release-commercial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      SIGN_KEY: ${{ secrets.DCIM_INTEGRITY_SIGN_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Unit tests
        working-directory: dcim/webapp
        run: |
          npm ci --omit=dev || npm install --omit=dev
          npm test

      - name: Licensing must be ON in this edition
        run: |
          if grep -q "LICENSE_PUBLIC_KEY_PEM: *null" dcim/webapp/lib/license-public-key.js; then
            echo "::error::dcim/webapp has a null licence key - this is the internal edition. Refusing a commercial build."; exit 1; fi
          grep -q "BEGIN PUBLIC KEY" dcim/webapp/lib/license-public-key.js
          grep -q "BEGIN PUBLIC KEY" dcim/webapp/lib/integrity-public-key.js
          echo "Licence and integrity public keys are pinned."

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/commercial-v')
        run: |
          v="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' dcim/webapp/package.json | head -1)"
          t="${GITHUB_REF_NAME#commercial-v}"
          [ "$v" = "$t" ] || { echo "::error::tag $GITHUB_REF_NAME does not match package version $v"; exit 1; }

      - name: Vendor signing key present
        if: github.event_name != 'workflow_dispatch' || inputs.require_signed
        run: |
          [ -n "$SIGN_KEY" ] || { echo "::error::secret DCIM_INTEGRITY_SIGN_KEY is not set - a customer build must be vendor-signed."; exit 1; }

      - name: Customer guides have no placeholders
        run: |
          bash packaging/tools/check-doc-placeholders.sh docs/guides || { echo "::error::Fill the vendor fields in docs/guides/support-contact-guide.md first."; exit 1; }

      - name: Release notes and known limitations mention this version
        run: |
          v="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' dcim/webapp/package.json | head -1)"
          grep -q "v$v" docs/RELEASE_NOTES.md
          test -s docs/KNOWN_LIMITATIONS.md

  build:
    needs: preflight
    uses: ./.github/workflows/build-packages.yml
    with:
      release_build: true
    secrets: inherit

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Download packages
        uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Every expected package exists
        run: |
          ls -R artifacts | head -60
          for pat in "artifacts/dcim-deb/*.deb" "artifacts/dcim-rpm/*.rpm" "artifacts/dcim-offline-appliance/*.run" \
                     "artifacts/dcim-windows-installer/*.exe" "artifacts/dcim-enterprise-offline-kit/*.tar.gz" "artifacts/dcim-enterprise-offline-kit/*.zip"; do
            ls $pat >/dev/null 2>&1 || { echo "::error::missing artifact: $pat"; exit 1; }
          done
          for e in dcim-setup DCIM-Upgrade DCIM-Repair; do ls artifacts/dcim-windows-installer/$e*.exe >/dev/null 2>&1 || { echo "::error::missing Windows $e"; exit 1; }; done

      - name: Vendor-signed manifest, pinned keys, no vendor tools (deb)
        run: bash packaging/tools/verify-signed-build.sh artifacts/dcim-deb/*.deb

      - name: Kit contents
        run: |
          mkdir kit && tar -xzf artifacts/dcim-enterprise-offline-kit/*.tar.gz -C kit
          K="$(find kit -maxdepth 1 -type d -name 'DCIM-Enterprise-Offline-Kit-*')"
          for f in CHECKSUMS.sha256 MANIFEST.txt common/docs/VERSION_REPORT.md common/docs/DEPENDENCY_REPORT.md common/release-notes/RELEASE_NOTES.md common/docs/KNOWN_LIMITATIONS.md; do
            test -s "$K/$f" || { echo "::error::kit is missing $f"; exit 1; }; done
          for g in customer-licensing-guide license-activation-guide license-renewal-guide support-contact-guide architecture-overview customer-handover-kit machine-rebind-procedure lost-license-recovery-guide; do
            test -s "$K/common/docs/guides/$g.md" || { echo "::error::kit is missing guide $g"; exit 1; }; done
          bash packaging/tools/check-doc-placeholders.sh "$K/common/docs/guides"
          (cd "$K" && sha256sum -c CHECKSUMS.sha256)

      - name: Checksums and summary
        run: |
          (cd artifacts && find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.run' -o -name '*.exe' -o -name '*.tar.gz' -o -name '*.zip' \) | sort | xargs sha256sum) | tee SHA256SUMS-commercial.txt
          { echo "### Commercial build $GITHUB_SHA"; echo '```'; cat SHA256SUMS-commercial.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: commercial-release-checksums
          path: SHA256SUMS-commercial.txt

  draft-release:
    if: startsWith(github.ref, 'refs/tags/commercial-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Create DRAFT release (a person publishes it after Windows and UAT sign-off)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "DCIM Commercial ${GITHUB_REF_NAME#commercial-v}" \
            --notes "Draft. Publish only after Windows certification and UAT sign-off." \
            $(find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.run' -o -name '*.exe' -o -name '*.tar.gz' -o -name '*.zip' -o -name 'SHA256SUMS-commercial.txt' \))
