name: Test fresh install on real Linux (RPM on AlmaLinux 8/9 with systemd, DEB on Ubuntu 22.04/24.04)

# Builds the real .rpm/.deb (vendor-signed, same scripts as the release) and installs them the way a customer
# would on a clean machine WITH a working systemd: dnf/apt install -> dcim-setup (embedded DB) -> customer-style
# smoke test -> kill-and-recover -> reboot (container restart) -> upgrade -> repair -> remove.
on:
  workflow_dispatch: {}
  push:
    branches: ["release/commercial"]
    paths:
      - ".github/workflows/test-linux-fresh-install.yml"
      - "packaging/tools/smoke-test.js"
      - "packaging/linux/install.sh"
      - "packaging/linux/fetch-*.sh"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage runtimes
        run: |
          bash packaging/linux/fetch-node-runtime.sh x64 packaging/linux/runtime
          bash packaging/linux/fetch-mariadb-runtime.sh packaging/linux/runtime
          sudo apt-get update -y && sudo apt-get install -y rpm
      - name: Build rpm + deb
        env:
          DCIM_INTEGRITY_SIGN_KEY: ${{ secrets.DCIM_INTEGRITY_SIGN_KEY }}
        run: |
          if [ -n "$DCIM_INTEGRITY_SIGN_KEY" ]; then
            kf="$RUNNER_TEMP/integrity-sign.pem"; printf '%s' "$DCIM_INTEGRITY_SIGN_KEY" > "$kf"; export DCIM_INTEGRITY_SIGN_KEY_FILE="$kf"
          fi
          bash packaging/linux/build-rpm.sh
          bash packaging/linux/build-deb.sh
          [ -n "${DCIM_INTEGRITY_SIGN_KEY_FILE:-}" ] && rm -f "$DCIM_INTEGRITY_SIGN_KEY_FILE"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-pkgs
          path: |
            dist/*.rpm
            dist/*.deb

  test-rpm-almalinux:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["almalinux/9-init", "almalinux/8-init"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: linux-pkgs, path: pkgs }
      - name: Start a clean systemd machine
        run: |
          docker run -d --name dcimt --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw ${{ matrix.image }}
          for i in $(seq 1 30); do docker exec dcimt systemctl is-system-running 2>/dev/null | grep -qE "running|degraded" && break; sleep 2; done
          docker exec dcimt systemctl is-system-running || true
          docker exec dcimt cat /etc/os-release | head -2
          docker cp pkgs/. dcimt:/root/pkgs
          docker cp packaging/tools/smoke-test.js dcimt:/root/smoke-test.js
      - name: Install the RPM (dnf resolves dependencies)
        run: docker exec dcimt bash -c 'dnf install -y /root/pkgs/dcim-*.rpm 2>&1 | tail -15'
      - name: dcim-setup with the embedded database
        run: docker exec dcimt bash -c 'dcim-setup --mode install --yes --embedded-db --port 8974 --admin-user ciadmin --admin-password "CiAdmin#Pass123"'
      - name: Diagnostics
        if: always()
        run: docker exec dcimt bash -c 'systemctl status dcim dcim-mariadb --no-pager | head -30; journalctl -u dcim -u dcim-mariadb --no-pager -n 80' || true
      - name: Services enabled for boot + customer smoke test
        run: |
          docker exec dcimt bash -c 'systemctl is-enabled dcim dcim-mariadb && systemctl is-active dcim dcim-mariadb'
          docker exec dcimt /usr/share/dcim/runtime/node/bin/node /root/smoke-test.js http://127.0.0.1:8974 ciadmin 'CiAdmin#Pass123'
      - name: Kill the app only - systemd must restart it
        run: |
          docker exec dcimt bash -c 'pkill -9 -f "[n]ode server.js"; sleep 5; systemctl is-active dcim'
          docker exec dcimt /usr/share/dcim/runtime/node/bin/node /root/smoke-test.js http://127.0.0.1:8974 ciadmin 'CiAdmin#Pass123'
      - name: Kill the database only - it must restart and the app must reconnect
        run: |
          docker exec dcimt bash -c 'pkill -9 -x mariadbd; sleep 5; systemctl is-active dcim-mariadb'
          docker exec dcimt /usr/share/dcim/runtime/node/bin/node /root/smoke-test.js http://127.0.0.1:8974 ciadmin 'CiAdmin#Pass123'
      - name: Kill both at once (power-loss style)
        run: |
          docker exec dcimt bash -c 'pkill -9 -f "[n]ode server.js"; pkill -9 -x mariadbd; sleep 5; systemctl is-active dcim dcim-mariadb'
          docker exec dcimt /usr/share/dcim/runtime/node/bin/node /root/smoke-test.js http://127.0.0.1:8974 ciadmin 'CiAdmin#Pass123'
      - name: Recovery diagnostics
        if: failure()
        run: docker exec dcimt bash -c 'systemctl status dcim dcim-mariadb --no-pager | head -40; journalctl -u dcim -u dcim-mariadb --no-pager -n 120; ss -ltnp' || true
      - name: Reboot (restart the machine) - services must auto-start
        run: |
          docker restart dcimt
          for i in $(seq 1 40); do docker exec dcimt systemctl is-system-running 2>/dev/null | grep -qE "running|degraded" && break; sleep 2; done
          sleep 20
          docker exec dcimt bash -c 'systemctl is-active dcim dcim-mariadb'
          docker exec dcimt /usr/share/dcim/runtime/node/bin/node /root/smoke-test.js http://127.0.0.1:8974 ciadmin 'CiAdmin#Pass123'
      - name: Upgrade, then repair
        run: |
          docker exec dcimt bash -c 'dcim-upgrade --yes 2>&1 | tail -8; sleep 5; dcim-repair --yes 2>&1 | tail -8; sleep 5'
          docker exec dcimt /usr/share/dcim/runtime/node/bin/node /root/smoke-test.js http://127.0.0.1:8974 ciadmin 'CiAdmin#Pass123'
      - name: Remove the package - nothing may be left running
        run: |
          docker exec dcimt bash -c 'dnf remove -y dcim 2>&1 | tail -4; sleep 3; systemctl is-active dcim dcim-mariadb || true; pgrep -fa "node server.js|mariadbd" || echo "no leftover processes"'

  test-deb-ubuntu:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: linux-pkgs, path: pkgs }
      - name: Install the DEB
        run: sudo apt-get install -y ./pkgs/dcim_*.deb
      - name: dcim-setup with the embedded database
        run: sudo dcim-setup --mode install --yes --embedded-db --port 8974 --admin-user ciadmin --admin-password "CiAdmin#Pass123"
      - name: Diagnostics
        if: always()
        run: sudo systemctl status dcim dcim-mariadb --no-pager | head -30; sudo journalctl -u dcim -u dcim-mariadb --no-pager -n 80 || true
      - name: Customer smoke test
        run: |
          systemctl is-enabled dcim dcim-mariadb && systemctl is-active dcim dcim-mariadb
          /usr/share/dcim/runtime/node/bin/node packaging/tools/smoke-test.js http://127.0.0.1:8974 ciadmin 'CiAdmin#Pass123'
      - name: Kill the app only - systemd must restart it
        run: |
          sudo pkill -9 -f "[n]ode server.js" || true; sleep 5; systemctl is-active dcim
          /usr/share/dcim/runtime/node/bin/node packaging/tools/smoke-test.js http://127.0.0.1:8974 ciadmin 'CiAdmin#Pass123'
      - name: Kill the database only - it must restart and the app must reconnect
        run: |
          sudo pkill -9 -x mariadbd || true; sleep 5; systemctl is-active dcim-mariadb
          /usr/share/dcim/runtime/node/bin/node packaging/tools/smoke-test.js http://127.0.0.1:8974 ciadmin 'CiAdmin#Pass123'
      - name: Kill both at once (power-loss style)
        run: |
          sudo pkill -9 -f "[n]ode server.js" || true; sudo pkill -9 -x mariadbd || true; sleep 5; systemctl is-active dcim dcim-mariadb
          /usr/share/dcim/runtime/node/bin/node packaging/tools/smoke-test.js http://127.0.0.1:8974 ciadmin 'CiAdmin#Pass123'
      - name: Recovery diagnostics
        if: failure()
        run: sudo systemctl status dcim dcim-mariadb --no-pager | head -40; sudo journalctl -u dcim -u dcim-mariadb --no-pager -n 120; sudo ss -ltnp || true
      - name: Upgrade, then repair
        run: |
          sudo dcim-upgrade --yes 2>&1 | tail -8; sleep 5; sudo dcim-repair --yes 2>&1 | tail -8; sleep 5
          /usr/share/dcim/runtime/node/bin/node packaging/tools/smoke-test.js http://127.0.0.1:8974 ciadmin 'CiAdmin#Pass123'
      - name: Remove the package - embedded DB must not be left running
        run: |
          sudo apt-get remove -y dcim; sleep 3
          systemctl is-active dcim dcim-mariadb || true
          pgrep -fa "node server.js|mariadbd" && { echo "FAIL: leftover processes"; exit 1; } || echo "no leftover processes"
